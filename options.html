<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; }
body {
  width: 380px; padding: 16px; margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #0d1117; color: #c9d1d9; font-size: 13px;
}
h1 { font-size: 18px; margin: 0 0 4px; color: #f0f6fc; }
.sub { color: #6e7681; font-size: 11px; margin-bottom: 14px; }
.section { background: #161b22; border: 1px solid #21262d; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
.section-title { color: #8b949e; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
label { display: flex; align-items: center; gap: 8px; margin: 8px 0; color: #c9d1d9; }
input, select {
  width: 100%; height: 34px; margin-bottom: 8px; padding: 7px 9px;
  border: 1px solid #30363d; border-radius: 9px; background: #0d1117; color: #c9d1d9;
}
input[type="checkbox"] { width: auto; height: auto; margin: 0; accent-color: #e94560; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
button {
  width: 100%; min-height: 34px; border: 1px solid #30363d; border-radius: 9px;
  background: #21262d; color: #c9d1d9; font-weight: 700; cursor: pointer; margin-top: 4px;
}
button:hover { background: #30363d; }
button.primary { background: #e94560; color: #fff; border-color: #e94560; }
button.danger { color: #e94560; border-color: rgba(233,69,96,0.45); background: transparent; }
button.danger:hover { background: rgba(233,69,96,0.08); }
.status { min-height: 16px; color: #3fb950; text-align: center; font-size: 11px; margin-top: 8px; }
</style>
</head>
<body>
  <h1>Autobilling Options</h1>
  <div class="sub">Global extension preferences and billing profiles</div>

  <div class="section">
    <div class="section-title">Preferences</div>
    <label><input type="checkbox" id="chkDefaultCompact"> Compact card view by default</label>
    <label><input type="checkbox" id="chkValidateBin"> Live BIN lookup</label>
  </div>

  <div class="section">
    <div class="section-title">Default profile</div>
    <select id="selProfile">
      <option value="generated">Generated random profile</option>
      <option value="US">US profile</option>
      <option value="NL">NL profile</option>
      <option value="custom">Custom profile</option>
    </select>
  </div>

  <div class="section">
    <div class="section-title">Custom profile</div>
    <input id="profileName" placeholder="Full name">
    <input id="profileAddr" placeholder="Address line 1">
    <div class="grid2">
      <input id="profileZip" placeholder="ZIP / postal">
      <input id="profileCity" placeholder="City">
    </div>
    <div class="grid2">
      <input id="profileCountry" placeholder="Country code, e.g. US">
      <input id="profileCountryName" placeholder="Country name">
    </div>
    <button id="btnSaveProfile">Save custom profile</button>
  </div>

  <div class="section">
    <button class="danger" id="btnClearHistory">Clear history</button>
  </div>

  <button class="primary" id="btnSave">Save settings</button>
  <div class="status" id="status"></div>

<script src="options.js"></script>
</body>
</html>
