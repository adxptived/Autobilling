name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run validate:extensions
      - run: npm run zip
      - uses: actions/upload-artifact@v4
        with:
          name: autobilling-extension
          path: autobilling-*.zip
